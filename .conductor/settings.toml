"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "npm run dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.test]
command = "npm test"
icon = "test-tube"

[scripts.run.typecheck]
command = "npm run typecheck"
icon = "list-checks"

[scripts.run.build]
command = "npm run build"
icon = "hammer"
